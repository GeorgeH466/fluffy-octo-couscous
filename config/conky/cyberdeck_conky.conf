-- ============================================================================
-- config/conky/cyberdeck_conky.conf - cyberdeck-arsenal desktop overlay
-- ============================================================================
--
-- Description
-- -----------
-- Conky configuration for the cyberdeck desktop: a translucent, cyberpunk
-- styled panel down the right-hand side showing system vitals (CPU, memory,
-- disk, network, battery, temperature), the WiFi/monitor interface state, the
-- status of the cyberdeck systemd units, and live counters straight out of the
-- toolkit's SQLite databases (probe requests, BLE devices, alerts, captures).
--
-- Author      : cyberdeck-arsenal contributors
-- Version     : 1.0.0
-- Dependencies: conky >= 1.12 (X11), optional: sensors, nvidia-smi,
--               the cyberdeck databases at /opt/cyberdeck-arsenal/data
-- Licence     : MIT - authorised use only (see docs/LEGAL.md)
--
-- Install
-- -------
--   conky -c /opt/cyberdeck-arsenal/config/conky/cyberdeck_conky.conf
--   # autostart:
--   mkdir -p ~/.config/autostart
--   cp /opt/cyberdeck-arsenal/config/conky/cyberdeck-conky.desktop ~/.config/autostart/
--
-- Notes
-- -----
-- * Everything is measurement-only. Nothing here attacks, scans or transmits.
-- * The database counters are read with sqlite3 in read-only mode, so conky
--   never blocks a logger that is writing to the same file.
-- * Colours match the HUD and the tmux theme: background #0b0f14, accent
--   #00ffd5, warning #ffb454, alert #ff5f5f.
-- ============================================================================

conky.config = {
    -- ---- placement ------------------------------------------------------- --
    alignment = 'top_right',
    gap_x = 18,
    gap_y = 42,
    minimum_width = 300,
    minimum_height = 700,
    maximum_width = 300,
    border_inner_margin = 8,
    border_outer_margin = 4,

    -- ---- window ---------------------------------------------------------- --
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_colour = '#0b0f14',
    own_window_argb_visual = true,
    own_window_argb_value = 165,
    double_buffer = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = true,
    stippled_borders = 0,
    border_width = 0,

    -- ---- fonts ----------------------------------------------------------- --
    use_xft = true,
    xftalpha = 0.9,
    font = 'DejaVu Sans Mono:size=9',
    override_utf8_locale = true,
    uppercase = false,

    -- ---- colours --------------------------------------------------------- --
    default_color = '#7d8b99',
    default_shade_color = '#0b0f14',
    default_outline_color = '#0b0f14',
    color0 = '#d7e3ee',   -- primary text
    color1 = '#00ffd5',   -- accent (matches the HUD)
    color2 = '#ffb454',   -- warning
    color3 = '#ff5f5f',   -- alert / critical
    color4 = '#7d8b99',   -- muted labels
    color5 = '#54606d',   -- separators
    color6 = '#5ac8fa',   -- network
    color7 = '#bd93f9',   -- radio / SDR

    -- ---- behaviour ------------------------------------------------------- --
    update_interval = 2.0,
    total_run_times = 0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    diskio_avg_samples = 2,
    text_buffer_size = 4096,
    short_units = true,
    pad_percents = 2,
    top_name_width = 16,
    no_buffers = true,
    out_to_console = false,
    out_to_stderr = false,
    extra_newline = false,
    imlib_cache_size = 0,
    template0 = '${color4}\\1${color0}${alignr}\\2',
}

-- ========================================================================== --
-- Template helpers
-- ========================================================================== --
-- Row: "label ............ value" with the label muted and the value bright.
-- Used throughout so the panel stays readable at a glance.

conky.text = [[
${color1}${font DejaVu Sans Mono:bold:size=11}  ⚡ CYBERDECK${font}${color}
${color5}  ──────────────────────────────────${color}
${color4}  ${nodename} · ${sysname} ${kernel}${color}
${color4}  uptime ${alignr}${color0}${uptime}${color}
${color4}  load ${alignr}${color0}${loadavg 1} ${loadavg 2} ${loadavg 3}${color}

${color1}${font DejaVu Sans Mono:bold:size=10}  SYSTEM${font}${color}
${color5}  ──────────────────────────────────${color}
  CPU ${alignr}${color0}${cpu cpu0}% ${color1}${cpubar cpu0 6,120}${color}
  ${color4}${top name 1}${alignr}${top cpu 1}%${color}
  ${color4}${top name 2}${alignr}${top cpu 2}%${color}
  ${color4}${top name 3}${alignr}${top cpu 3}%${color}
  MEM ${alignr}${color0}${mem} / ${memmax} ${color1}${membar 6,120}${color}
  SWAP ${alignr}${color0}${swap} / ${swapmax}${color}
  DISK ${alignr}${color0}${fs_used /} / ${fs_size /} ${color1}${fs_bar 6,120 /}${color}
  I/O ${alignr}${color0}read ${diskio_read} · write ${diskio_write}${color}

${color1}${font DejaVu Sans Mono:bold:size=10}  RADIO / WIFI${font}${color}
${color5}  ──────────────────────────────────${color}
${if_match "${execpi 10 iw dev 2>/dev/null | awk '/Interface/ {iface=$2} /type monitor/ {print iface; exit}'}" != ""}\
  MONITOR ${alignr}${color2}${execpi 10 iw dev 2>/dev/null | awk '/Interface/ {iface=$2} /type monitor/ {print iface; exit}'}${color}
${else}\
  MONITOR ${alignr}${color4}none${color}
${endif}\
${if_match "${execpi 10 iw dev 2>/dev/null | awk '/ssid/ {print $2; exit}'}" != ""}\
  SSID ${alignr}${color0}${execpi 10 iw dev 2>/dev/null | awk '/ssid/ {print $2; exit}'}${color}
${endif}\
  LINK ${alignr}${color6}↓${downspeedf wlan0} ↑${upspeedf wlan0} kB/s${color}
  ${color4}${downspeedgraph wlan0 22,120 00ffd5 5ac8fa}${color}
  IP ${alignr}${color0}${addr wlan0}${color}
${if_existing /sys/class/net/wlan0/wireless}\
  CHANNEL ${alignr}${color0}${execi 20 iw dev wlan0 info 2>/dev/null | awk '/channel/ {print $2}'}${color}
${endif}\
${if_existing /sys/class/power_supply/BAT0}\
  BATTERY ${alignr}${color0}${battery_percent BAT0}%${color} ${color1}${battery_bar 6,120 BAT0}${color}
${endif}\
  TEMP ${alignr}${color0}${execi 5 sensors 2>/dev/null | awk '/^Package id 0:|^Tctl:|^temp1:/ {print $2; exit}'}${color}

${color1}${font DejaVu Sans Mono:bold:size=10}  SERVICES${font}${color}
${color5}  ──────────────────────────────────${color}
${if_match "${execpi 15 systemctl is-active cyberdeck-monitor.service 2>/dev/null | tr -d '\n'}" == "active"}\
  monitor ${alignr}${color1}active${color}
${else}\
  monitor ${alignr}${color4}inactive${color}
${endif}\
${if_match "${execpi 15 systemctl is-active cyberdeck-probe-logger.service 2>/dev/null | tr -d '\n'}" == "active"}\
  probes ${alignr}${color1}active${color}
${else}\
  probes ${alignr}${color4}inactive${color}
${endif}\
${if_match "${execpi 15 systemctl is-active cyberdeck-ble-scanner.service 2>/dev/null | tr -d '\n'}" == "active"}\
  bluetooth ${alignr}${color1}active${color}
${else}\
  bluetooth ${alignr}${color4}inactive${color}
${endif}\
${if_match "${execpi 15 systemctl is-active cyberdeck-rogue-ap-detector.service 2>/dev/null | tr -d '\n'}" == "active"}\
  rogue-ap ${alignr}${color1}active${color}
${else}\
  rogue-ap ${alignr}${color4}inactive${color}
${endif}\

${color1}${font DejaVu Sans Mono:bold:size=10}  RECON FEED${font}${color}
${color5}  ──────────────────────────────────${color}
  PROBES ${alignr}${color0}${execi 30 sqlite3 -readonly /opt/cyberdeck-arsenal/data/probes.db "select count(*) from probe_requests" 2>/dev/null || echo 0}${color}
  DEVICES ${alignr}${color0}${execi 30 sqlite3 -readonly /opt/cyberdeck-arsenal/data/probes.db "select count(*) from devices" 2>/dev/null || echo 0}${color}
  BLE ${alignr}${color0}${execi 30 sqlite3 -readonly /opt/cyberdeck-arsenal/data/ble.db "select count(*) from ble_devices" 2>/dev/null || echo 0}${color}
  BLE VULN ${alignr}${color2}${execi 60 sqlite3 -readonly /opt/cyberdeck-arsenal/data/ble.db "select count(*) from ble_devices where vulnerable=1" 2>/dev/null || echo 0}${color}
  HOSTS ${alignr}${color0}${execi 30 sqlite3 -readonly /opt/cyberdeck-arsenal/data/arp.db "select count(*) from arp_hosts" 2>/dev/null || echo 0}${color}
  SERVICES ${alignr}${color0}${execi 30 sqlite3 -readonly /opt/cyberdeck-arsenal/data/services.db "select count(*) from services" 2>/dev/null || echo 0}${color}

${color1}${font DejaVu Sans Mono:bold:size=10}  ALERTS (24h)${font}${color}
${color5}  ──────────────────────────────────${color}
  CRITICAL ${alignr}${color3}${execi 60 sqlite3 -readonly /opt/cyberdeck-arsenal/data/events.db "select count(*) from alerts where severity in ('CRITICAL','ERROR') and ts > datetime('now','-1 day')" 2>/dev/null || echo 0}${color}
  WARNING ${alignr}${color2}${execi 60 sqlite3 -readonly /opt/cyberdeck-arsenal/data/events.db "select count(*) from alerts where severity='WARNING' and ts > datetime('now','-1 day')" 2>/dev/null || echo 0}${color}
${color4}${execi 60 sqlite3 -readonly /opt/cyberdeck-arsenal/data/events.db "select '  ' || substr(message,1,34) from alerts order by id desc limit 4" 2>/dev/null || echo "  no alerts recorded"}${color}

${color1}${font DejaVu Sans Mono:bold:size=10}  CAPTURES${font}${color}
${color5}  ──────────────────────────────────${color}
  FILES ${alignr}${color0}${execi 60 find /opt/cyberdeck-arsenal/captures -type f 2>/dev/null | wc -l}${color}
  SIZE ${alignr}${color0}${execi 60 du -sh /opt/cyberdeck-arsenal/captures 2>/dev/null | awk '{print $1}'}${color}
  LATEST ${alignr}${color4}${execi 60 ls -t /opt/cyberdeck-arsenal/captures 2>/dev/null | head -1}${color}
${color5}  ──────────────────────────────────${color}
${color4}  ${time %H:%M:%S} · ${time %a %d %b}${color}
${color1}  cdeck help${color4} for the command list${color}
]]
