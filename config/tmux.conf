# =============================================================================
# config/tmux.conf - cyberdeck-arsenal tmux configuration
# =============================================================================
#
# Description
# -----------
# A tmux setup designed for fieldwork on a small screen: prefix on C-a (C-b is
# left free for shells that use it), an engagement-oriented status bar with
# battery / load / WiFi / threat indicators, Vi-style copy mode, panes that
# follow the current directory, and one-key layouts for the standard deck
# workflows (dashboard + recon + logs + attack, all in one window).
#
# Author      : cyberdeck-arsenal contributors
# Version     : 1.0.0
# Dependencies: tmux >= 3.0, bash, optional: btop, cdeck
# Licence     : MIT - authorised use only (see docs/LEGAL.md)
#
# Install
# -------
#   tmux -f /opt/cyberdeck-arsenal/config/tmux.conf
#   # or link it into place:
#   ln -sf /opt/cyberdeck-arsenal/config/tmux.conf ~/.tmux.conf
#
# Key reference (also in docs/KEYBINDS.md):
#   Prefix = C-a
#   | and -      split vertically / horizontally
#   h j k l      move between panes
#   C-a d        start the dashboard layout
#   C-a r        start the recon layout
#   C-a a        start the attack layout (asks for authorisation)
#   C-a l        toggle the log tail pane
#   C-a H        open the keybind cheat sheet
# =============================================================================

# --------------------------------------------------------------------------- #
# Basics
# --------------------------------------------------------------------------- #
set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g allow-rename off
set -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"
set -g detach-on-destroy off
set -g mouse on
setw -g mode-keys vi
set -g status-interval 5
set -g display-time 3000
set -g visual-activity off
set -g visual-bell off
set -g bell-action none
set -g monitor-activity off

# --------------------------------------------------------------------------- #
# Appearance: cyberpunk palette matching the HUD
# --------------------------------------------------------------------------- #
set -g status-style "bg=#0b0f14,fg=#7d8b99"
set -g status-left-length 40
set -g status-right-length 90
set -g window-status-style "fg=#54606d,bg=#0b0f14"
set -g window-status-current-style "fg=#0b0f14,bg=#00ffd5,bold"
set -g window-status-activity-style "fg=#ffb454,bg=#0b0f14"
set -g pane-border-style "fg=#263042"
set -g pane-active-border-style "fg=#00ffd5"
set -g message-style "bg=#00ffd5,fg=#0b0f14,bold"
set -g message-command-style "bg=#0b0f14,fg=#00ffd5"
setw -g clock-mode-colour "#00ffd5"
setw -g mode-style "fg=#0b0f14,bg=#ffb454"
set -g popup-border-style "fg=#00ffd5"
set -g popup-border-lines rounded

# Left: session name and the current engagement, if one is set
set -g status-left "#[fg=#0b0f14,bg=#00ffd5,bold] ⚡ #S #[fg=#00ffd5,bg=#0b0f14,nobold]#[fg=#ffb454] #{?#{==:#{@engagement},},,⚑ #{@engagement}} #[fg=#54606d]│ "

# Right: load, battery, temperature, WiFi, active alerts, clock
set -g status-right "#[fg=#54606d]│ #[fg=#7d8b99]LD #[fg=#00ffd5]#{l:$(( #{cpu_percentage} ))},#{loadavg_1}"
set -ga status-right " #[fg=#7d8b99]BAT #[fg=#{?#{m/r:.*(0|1|2)[0-9]%,#{battery_percentage}},#ff5f5f,#00ffd5}]#{battery_percentage}"
set -ga status-right " #[fg=#7d8b99]WIFI #[fg=#00ffd5]#{?#{==:#{@wifi_ssid},},--,#{@wifi_ssid}}"
set -ga status-right " #[fg=#ff5f5f]#{?#{==:#{@alerts},},,⚠ #{@alerts}}"
set -ga status-right " #[fg=#54606d]│ #[fg=#ffb454]%H:%M %d-%b "

# --------------------------------------------------------------------------- #
# Panes and windows
# --------------------------------------------------------------------------- #
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+
bind z resize-pane -Z
bind q kill-pane
bind x confirm-before -p "kill window #W? (y/n)" kill-window
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# Keep the pane title as the directory and show it in the border
set -g pane-border-status top
set -g pane-border-format "#[fg=#54606d] #{pane_index} #[fg=#00ffd5]#{pane_title} "
bind m command-prompt -p "rename pane:" "select-pane -T '%%'"

# --------------------------------------------------------------------------- #
# Copy mode (vi) and search
# --------------------------------------------------------------------------- #
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-c send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi / command-prompt -i -p "(search down)" "send-keys -X search-forward-incremental \"%%\""
bind -T copy-mode-vi ? command-prompt -i -p "(search up)" "send-keys -X search-backward-incremental \"%%\""
bind p paste-buffer
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i 2>/dev/null || xsel -b -i 2>/dev/null || true"

# --------------------------------------------------------------------------- #
# Layouts
# --------------------------------------------------------------------------- #
# C-a d : dashboard + logs + shell
bind d run-shell -b 'echo starting dashboard layout' \; \
    split-window -h -l 45% -c "#{pane_current_path}" 'cdeck dashboard' \; \
    split-window -v -l 30% -c "#{pane_current_path}" 'tail -f /opt/cyberdeck-arsenal/logs/cyberdeck.log' \; \
    select-pane -t 1 \; \
    display-message "dashboard layout ready"

# C-a r : recon workbench - survey, passive logging, scratch shell
bind r split-window -h -l 40% -c "#{pane_current_path}" \
        '/opt/cyberdeck-arsenal/recon/active/network_scanner.sh --help; exec bash' \; \
    split-window -v -l 30% -c "#{pane_current_path}" \
        'tail -f /opt/cyberdeck-arsenal/logs/wifi_probe_logger.log 2>/dev/null || tail -f /opt/cyberdeck-arsenal/logs/cyberdeck.log' \; \
    select-pane -t 1 \; \
    display-message "recon layout ready - run 'cdeck scan <target>' in the top pane"

# C-a a : attack layout - deliberately silent about what it does until confirmed
bind a confirm-before -p "Open the ATTACK layout? Authorised targets only (y/n)" \
    'split-window -h -l 45% -c "#{pane_current_path}" \
     "sudo /opt/cyberdeck-arsenal/attack/wifi_arsenal.sh || exec bash" \; \
     split-window -v -l 30% -c "#{pane_current_path}" \
     "tail -f /opt/cyberdeck-arsenal/logs/wifi_arsenal.log 2>/dev/null || exec bash"'

# C-a s : service supervision pane
bind s split-window -v -l 30% -c "#{pane_current_path}" \
    'watch -n 5 "systemctl --no-pager --plain list-units cyberdeck-* --all"'

# C-a C : capture pane to a timestamped file in captures/
bind C command-prompt -p "capture pane to:" "capture-pane -S -3000 -p > %%"

# C-a H : the cheat sheet
bind H display-popup -E -w 70% -h 70% \
    '/opt/cyberdeck-arsenal/bin/cdeck help 2>/dev/null || less /opt/cyberdeck-arsenal/docs/KEYBINDS.md'

# C-a C-t : theme switcher popup
bind C-t display-popup -E -w 60% -h 60% \
    'sudo /opt/cyberdeck-arsenal/aesthetic/theme_switcher.sh' \; \
    display-message "theme switcher closed - new theme applies to new panes"

# --------------------------------------------------------------------------- #
# Session behaviour
# --------------------------------------------------------------------------- #
set -g status-keys vi
set -g set-titles on
set -g set-titles-string "cyberdeck · #S · #W"
set-hook -g client-session-changed 'set -g @engagement "#{?#{==:#{@engagement},},,#{@engagement}}"'

# Keep panes open when a command exits so results stay on screen
set -g remain-on-exit off
setw -g aggressive-resize on

# Load an operator-specific override if present
if-shell 'test -f ~/.tmux.conf.local' 'source-file ~/.tmux.conf.local'

# --------------------------------------------------------------------------- #
# Bindings for the deck's own commands (popups, so panes are not disturbed)
# --------------------------------------------------------------------------- #
bind P display-popup -E -w 84% -h 80% '/opt/cyberdeck-arsenal/bin/cdeck packets'
bind Y display-popup -E -w 84% -h 80% '/opt/cyberdeck-arsenal/bin/cdeck threats'
bind N display-popup -E -w 84% -h 80% '/opt/cyberdeck-arsenal/bin/cdeck netmap'
bind F display-popup -E -w 84% -h 80% '/opt/cyberdeck-arsenal/bin/cdeck rf'
bind S display-popup -E -w 70% -h 60% '/opt/cyberdeck-arsenal/bin/cdeck status | less'
